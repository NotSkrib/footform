<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Admin ⚽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pitch: #111a14;
      --gold: #f5c842;
      --red: #e63946;
      --blue: #1d6fa4;
      --white: #f8f8f0;
      --card: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--pitch);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
    }

    .dash-header {
      background: #000;
      border-bottom: 3px solid var(--gold);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .dash-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--gold);
    }
    .dash-header .meta { color: rgba(255,255,255,0.5); font-size: 13px; }

    .stats-bar {
      display: flex;
      gap: 16px;
      padding: 20px 32px;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 20px;
      min-width: 130px;
      text-align: center;
    }
    .stat-card .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: var(--gold);
      line-height: 1;
    }
    .stat-card .stat-label { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

    .table-wrap {
      padding: 0 32px 60px;
      overflow-x: auto;
    }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 900px;
    }
    thead tr { background: rgba(245,200,66,0.1); }
    thead th {
      text-align: left;
      padding: 10px 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--gold);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    tbody td {
      padding: 10px 14px;
      color: rgba(255,255,255,0.8);
      vertical-align: top;
      max-width: 200px;
    }

    .badge-event {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .badge-event.both { background: rgba(245,200,66,0.15); color: var(--gold); border: 1px solid rgba(245,200,66,0.3); }
    .badge-event.seville { background: rgba(230,57,70,0.15); color: #ff6b78; border: 1px solid rgba(230,57,70,0.3); }
    .badge-event.greenwich { background: rgba(29,111,164,0.15); color: #6db8f0; border: 1px solid rgba(29,111,164,0.3); }
    .badge-event.neither { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.4); border: 1px solid var(--border); }

    .date-cell { color: rgba(255,255,255,0.35); font-size: 12px; white-space: nowrap; }

    .actions-bar {
      padding: 0 32px 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-export {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-export:hover { background: rgba(245,200,66,0.1); }

    .btn { background: transparent; border: 1px solid var(--red); color: var(--red); font-family: 'Barlow Condensed', sans-serif; font-size: 12px; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    .btn:hover { background: rgba(230,57,70,0.1); }

    .loading { text-align: center; padding: 60px; color: rgba(255,255,255,0.3); font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 3px; }
    .error-text { color: var(--red); text-align: center; padding: 40px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="dash-header">
    <div>
      <h1>⚽ Survey Responses</h1>
      <div class="meta">10 Year Anniversary · Seville &amp; Greenwich</div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card"><div class="stat-num" id="statTotal">–</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num" id="statBoth">–</div><div class="stat-label">Both Events</div></div>
    <div class="stat-card"><div class="stat-num" id="statSeville">–</div><div class="stat-label">Seville Only</div></div>
    <div class="stat-card"><div class="stat-num" id="statGreenwich">–</div><div class="stat-label">Greenwich Only</div></div>
    <div class="stat-card"><div class="stat-num" id="statNeither">–</div><div class="stat-label">Can't Make It</div></div>
    <div class="stat-card"><div class="stat-num" id="statFullyIn">–</div><div class="stat-label">100% Seville In</div></div>
  </div>

  <div class="actions-bar">
    <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn-export" onclick="loadData()">↻ Refresh</button>
  </div>

  <div class="table-wrap">
    <div class="section-title">All Responses</div>
    <div id="tableContainer"><div class="loading">LOADING…</div></div>
  </div>

<script>
  let allResponses = [];

  async function loadData() {
    document.getElementById('tableContainer').innerHTML = '<div class="loading">LOADING…</div>';
    try {
      const res = await fetch('/api/admin/responses');
      if (!res.ok) throw new Error('Failed');
      const data = await res.json();
      allResponses = data.responses || [];
      renderStats(allResponses);
      renderTable(allResponses);
    } catch {
      document.getElementById('tableContainer').innerHTML = '<div class="error-text">Failed to load responses. Make sure the server is running.</div>';
    }
  }

  function renderStats(rs) {
    document.getElementById('statTotal').textContent = rs.length;
    document.getElementById('statBoth').textContent = rs.filter(r => r.attendingEvents.includes('Both')).length;
    document.getElementById('statSeville').textContent = rs.filter(r => r.attendingEvents === 'Seville only').length;
    document.getElementById('statGreenwich').textContent = rs.filter(r => r.attendingEvents === 'Greenwich only').length;
    document.getElementById('statNeither').textContent = rs.filter(r => r.attendingEvents.includes("Can't")).length;
    document.getElementById('statFullyIn').textContent = rs.filter(r => r.sevilleLikelihood && r.sevilleLikelihood.includes('100%')).length;
  }

  function eventBadge(val) {
    if (!val) return '';
    if (val.includes('Both')) return `<span class="badge-event both">Both</span>`;
    if (val.includes('Seville')) return `<span class="badge-event seville">Seville</span>`;
    if (val.includes('Greenwich')) return `<span class="badge-event greenwich">Greenwich</span>`;
    return `<span class="badge-event neither">Neither</span>`;
  }

  function cell(val) {
    return `<td>${val || '<span style="opacity:0.25">–</span>'}</td>`;
  }

  function renderTable(rs) {
    if (!rs.length) {
      document.getElementById('tableContainer').innerHTML = '<div class="loading">NO RESPONSES YET</div>';
      return;
    }
    const rows = rs.map(r => `
      <tr>
        <td><strong>${escHtml(r.fullName)}</strong></td>
        <td>${eventBadge(r.attendingEvents)}</td>
        ${cell(r.sevilleLikelihood)}
        ${cell(r.sevilleDays)}
        ${cell(r.sevilleLaLiga)}
        ${cell(r.sevilleMatch)}
        ${cell(r.sevilleAccommodation)}
        ${cell(r.greenwichPlan)}
        ${cell(r.suggestions ? escHtml(r.suggestions) : null)}
        <td class="date-cell">${new Date(r.submittedAt).toLocaleDateString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</td>
        <td><button class="btn" onclick="deleteResponse('${r.id}')">Delete</button></td>
      </tr>
    `).join('');

    document.getElementById('tableContainer').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Attending</th><th>Seville Likelihood</th><th>Days</th>
            <th>La Liga</th><th>Match Type</th><th>Accommodation</th>
            <th>Greenwich Plan</th><th>Suggestions</th><th>Submitted</th><th></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  async function deleteResponse(id) {
    if (!confirm('Delete this response?')) return;
    const res = await fetch(`/api/admin/responses/${id}`, { method: 'DELETE' });
    if (res.ok) loadData();
  }

  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function exportCSV() {
    if (!allResponses.length) { alert('No responses to export yet.'); return; }
    const cols = ['fullName','attendingEvents','sevilleLikelihood','sevilleDays','sevilleLaLiga','sevilleMatch','sevilleAccommodation','greenwichPlan','suggestions','submittedAt'];
    const headers = ['Name','Attending','Seville Likelihood','Days','La Liga','Match Type','Accommodation','Greenwich Plan','Suggestions','Submitted'];
    const rows = allResponses.map(r => cols.map(c => `"${(r[c] || '').toString().replace(/"/g,'""')}"`).join(','));
    const csv = [headers.join(','), ...rows].join('\r\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.setAttribute('download', `survey-responses-${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  loadData();
</script>
</body>
</html>
